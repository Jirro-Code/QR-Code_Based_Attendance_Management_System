# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - attendscan-api

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendscan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attendscan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        working-directory: backend
        env:
          APP_STAGE: test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/attendscan_test
        run: |
          npm ci
          npm run build
          npm run test

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_56ac1541-4c6e-40ac-9f9e-1dd231a17eb2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8d27b963-a551-497c-b54f-87b5303201ed }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_b782dcc3-c678-4752-99ed-f30f98fcf9d3 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'attendscan-api'
          slot-name: 'Production'
          package: .
          
