# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - attendscan-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendscan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attendscan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install, build, and test
        working-directory: backend
        env:
          APP_STAGE: test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/attendscan_test
        run: |
          npm ci
          npm run build
          npm run test

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_24B91477D9D04EE5AFA3ACB5E1F92C46 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8D27B963A551497CB54F87B5303201ED }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B782DCC3C678475299EDF30F98FCF9D3 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: attendscan-api
          slot-name: Production
          package: .
